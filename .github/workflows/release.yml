name: Release Creation

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Extract tag version number
        id: get_version
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version-without-v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Substitute Manifest and Download Links For Versioned Ones
        id: sub_manifest_link_version
        env:
          version: ${{steps.get_version.outputs.version-without-v}}
          manifest: https://github.com/${{github.repository}}/releases/latest/download/module.json
          download: https://github.com/${{github.repository}}/releases/download/${{steps.get_version.outputs.version}}/dfreds-convenient-effects.zip
        run: |
          node --input-type=module <<'EOF'
          import fs from "node:fs";

          const file = "dist/module.json";
          const moduleJson = JSON.parse(fs.readFileSync(file, "utf8"));
          for (const key of ["version", "manifest", "download"]) {
              moduleJson[key] = process.env[key];
          }
          fs.writeFileSync(file, JSON.stringify(moduleJson, null, 4));
          EOF

      - name: Zip files
        working-directory: ./dist
        run: zip -r ./dfreds-convenient-effects.zip ./*

      - name: Create versioned release
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true # Set this to false if you want to prevent updating existing releases
          artifacts: "./dist/module.json, ./dist/dfreds-convenient-effects.zip"
          draft: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
